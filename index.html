 <!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti 💕mi K</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    overflow: hidden;
    font-family: 'Georgia', serif;
    background: radial-gradient(ellipse at center, #2a0a1a 0%, #0d0208 100%);
    height: 100vh;
  }
  #canvas-container {
    position: fixed;
    inset: 0;
    z-index: 1;
  }
  /* Sticker principal de Luffy */
  #luffy-main {
    position: fixed;
    top: 8%;
    left: 50%;
    transform: translateX(-50%);
    width: 160px;
    z-index: 3;
    filter: drop-shadow(0 10px 25px rgba(255, 105, 180, 0.6));
    animation: floatMain 3.5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes floatMain {
    0%, 100% { transform: translateX(-50%) translateY(0) rotate(-2deg); }
    50% { transform: translateX(-50%) translateY(-14px) rotate(2deg); }
  }
  /* Stickers decorativos */
  .deco {
    position: fixed;
    z-index: 3;
    filter: drop-shadow(0 6px 15px rgba(255, 182, 193, 0.5));
    pointer-events: none;
    opacity: 0.95;
  }
  .deco-1 {
    top: 12%; left: 6%; width: 90px;
    animation: floatDeco 4s ease-in-out infinite;
  }
  .deco-2 {
    top: 18%; right: 7%; width: 85px;
    animation: floatDeco 4.5s ease-in-out infinite 0.5s;
  }
  .deco-3 {
    bottom: 22%; left: 8%; width: 80px;
    animation: floatDeco 5s ease-in-out infinite 1s;
  }
  @keyframes floatDeco {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-10px) rotate(3deg); }
  }
  /* Carta */
  #letter {
    position: fixed;
    bottom: 4%;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 240, 245, 0.96);
    padding: 22px 32px;
    border-radius: 16px;
    max-width: 400px;
    text-align: center;
    z-index: 4;
    box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 182, 193, 0.6) inset;
    border: 1px solid #ffb6c1;
    backdrop-filter: blur(8px);
  }
  #letter h2 {
    color: #d45d79;
    margin: 0 0 10px;
    font-size: 1.35em;
    letter-spacing: 0.5px;
  }
  #letter p {
    color: #5a3a4a;
    line-height: 1.75;
    font-size: 0.92em;
    margin: 0;
  }
  #music-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 10;
    background: linear-gradient(135deg, #d45d79, #b84a64);
    color: white;
    border: none;
    border-radius: 30px;
    padding: 11px 22px;
    cursor: pointer;
    font-size: 0.88em;
    font-family: inherit;
    box-shadow: 0 4px 18px rgba(212, 93, 121, 0.5);
    transition: transform 0.2s;
  }
  #music-btn:hover { transform: scale(1.05); }
  @media (max-width: 600px) {
    #luffy-main { width: 110px; top: 6%; }
    .deco-1, .deco-2, .deco-3 { width: 60px; }
    #letter { max-width: 88%; padding: 16px 20px; }
  }
</style>
</head>
<body>

<button id="music-btn">🎵 Reproducir música</button>

<!-- Stickers de Giphy como decoración -->
<img id="luffy-main" src="https://media2.giphy.com/media/v1.Y2lkPTZjMDliOTUyeGhqNjdzdjRscG4xaGhubGVkeW05M2R2MTRpbG93NjM5cGlldWFkdSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/2aKoKy8bAWJr8bBMak/giphy.webp" alt="Luffy">

<img class="deco deco-1" src="https://media.giphy.com/media/p8UwphhvFXKrxS42fk/giphy.gif" alt="deco1">
<img class="deco deco-2" src="https://media.giphy.com/media/x2GRI1mBm4kBXv0njJ/giphy.gif" alt="deco2">
<img class="deco deco-3" src="https://media.giphy.com/media/H0hCZKoldTWPzil50u/giphy.gif" alt="deco3">

<div id="canvas-container"></div>

<div id="letter">
  <h2>🌷 Para ti 🌷</h2>
  <p>
    Aunque Luffy está ocupado buscando el One Piece,<br>
    me pidió que te entregara este ramo de tulipanes.<br>
    <strong>¿Quieres ser mi compañero/a de aventura?</strong>
  </p>
</div>

<audio id="bg-music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ===== Escena =====
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x1a0510, 0.06);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 2.2, 6.5);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.getElementById('canvas-container').appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.target.set(0, 1.4, 0);
controls.enablePan = false;
controls.minDistance = 3.5;
controls.maxDistance = 12;
controls.minPolarAngle = 0.5;
controls.maxPolarAngle = 1.6;

// ===== Iluminación de estudio =====
scene.add(new THREE.AmbientLight(0xffd6e0, 0.55));

const keyLight = new THREE.DirectionalLight(0xfff2e6, 3.2);
keyLight.position.set(4, 8, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 30;
keyLight.shadow.camera.left = -6;
keyLight.shadow.camera.right = 6;
keyLight.shadow.camera.top = 6;
keyLight.shadow.camera.bottom = -6;
keyLight.shadow.bias = -0.0005;
scene.add(keyLight);

const fillLight = new THREE.PointLight(0xff8fbc, 2.0, 20, 2);
fillLight.position.set(-4, 3, 4);
scene.add(fillLight);

const rimLight = new THREE.PointLight(0xc8a2ff, 2.5, 20, 2);
rimLight.position.set(0, 4, -6);
scene.add(rimLight);

const bottomLight = new THREE.PointLight(0xffb6c1, 1.0, 12, 2);
bottomLight.position.set(0, -1, 3);
scene.add(bottomLight);

// ===== Suelo con reflejo suave =====
const floorGeo = new THREE.CircleGeometry(12, 64);
const floorMat = new THREE.MeshStandardMaterial({
  color: 0x2a1020,
  roughness: 0.35,
  metalness: 0.6,
  envMapIntensity: 0.8
});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.02;
floor.receiveShadow = true;
scene.add(floor);

// ===== Tulipán 3D hiperrealista procedural =====
function createPetalGeometry(width, height, cup) {
  // Pétalo en forma de cuchara curvada
  const shape = new THREE.Shape();
  shape.moveTo(0, 0);
  shape.bezierCurveTo(width * 0.6, height * 0.15, width * 0.75, height * 0.55, width * 0.35, height * 0.95);
  shape.bezierCurveTo(width * 0.15, height * 1.05, -width * 0.15, height * 1.05, -width * 0.35, height * 0.95);
  shape.bezierCurveTo(-width * 0.75, height * 0.55, -width * 0.6, height * 0.15, 0, 0);

  const geo = new THREE.ShapeGeometry(shape, 32);
  const pos = geo.attributes.position;
  // Curvar el pétalo hacia dentro (forma de copa)
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const y = pos.getY(i);
    const z = -cup * (x * x) * (0.5 + y / height) + Math.sin(y / height * Math.PI) * 0.04;
    pos.setZ(i, z);
  }
  geo.computeVertexNormals();
  return geo;
}

function createTulip(color, scale = 1) {
  const group = new THREE.Group();

  // Material del pétalo: cera suave, brillo tenue, doble cara
  const petalMat = new THREE.MeshPhysicalMaterial({
    color: color,
    roughness: 0.42,
    metalness: 0.0,
    clearcoat: 0.55,
    clearcoatRoughness: 0.35,
    sheen: 0.8,
    sheenColor: new THREE.Color(0xffffff),
    sheenRoughness: 0.5,
    side: THREE.DoubleSide,
    transmission: 0.08,
    thickness: 0.4,
    ior: 1.4
  });

  const petalWidth = 0.32 * scale;
  const petalHeight = 0.62 * scale;

  // 6 pétalos en dos anillos (3 externos + 3 internos) — tulipán real tiene 6
  const outerAngles = [0, Math.PI * 2 / 3, Math.PI * 4 / 3];
  const innerAngles = [Math.PI / 3, Math.PI, Math.PI * 5 / 3];

  function addPetal(angle, isInner) {
    const geo = createPetalGeometry(petalWidth, petalHeight, isInner ? 4.5 : 3.8);
    const petal = new THREE.Mesh(geo, petalMat);
    // Inclinar hacia fuera
    const tilt = isInner ? 0.12 : 0.28;
    petal.rotation.x = -tilt;
    petal.rotation.y = angle;
    petal.position.y = isInner ? 0.06 * scale : 0;
    petal.castShadow = true;
    petal.receiveShadow = true;
    group.add(petal);
  }
  outerAngles.forEach(a => addPetal(a, false));
  innerAngles.forEach(a => addPetal(a, true));

  // Estambres (centro oscuro con polen)
  const stamenMat = new THREE.MeshStandardMaterial({ color: 0x2b1a10, roughness: 0.8 });
  const pollenMat = new THREE.MeshStandardMaterial({ color: 0xf5c542, roughness: 0.6, emissive: 0x8a6a10, emissiveIntensity: 0.3 });
  for (let i = 0; i < 6; i++) {
    const ang = (i / 6) * Math.PI * 2;
    const stamen = new THREE.Mesh(
      new THREE.CylinderGeometry(0.008 * scale, 0.012 * scale, 0.16 * scale, 6),
      stamenMat
    );
    stamen.position.set(Math.cos(ang) * 0.05 * scale, 0.1 * scale, Math.sin(ang) * 0.05 * scale);
    group.add(stamen);
    const pollen = new THREE.Mesh(
      new THREE.SphereGeometry(0.02 * scale, 8, 8),
      pollenMat
    );
    pollen.position.copy(stamen.position).add(new THREE.Vector3(0, 0.09 * scale, 0));
    group.add(pollen);
  }
  const pistil = new THREE.Mesh(
    new THREE.SphereGeometry(0.045 * scale, 12, 12),
    new THREE.MeshStandardMaterial({ color: 0x3d2414, roughness: 0.7 })
  );
  pistil.position.y = 0.09 * scale;
  group.add(pistil);

  return group;
}

function createStem(height, curveAmount) {
  const group = new THREE.Group();
  // Curva del tallo (los tulipanes se doblan ligeramente)
  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, 0, 0),
    new THREE.Vector3(curveAmount * 0.3, height * 0.33, curveAmount * 0.2),
    new THREE.Vector3(curveAmount * 0.6, height * 0.66, -curveAmount * 0.3),
    new THREE.Vector3(curveAmount, height, 0)
  ]);
  const tubeGeo = new THREE.TubeGeometry(curve, 24, 0.025, 10, false);
  const stemMat = new THREE.MeshPhysicalMaterial({
    color: 0x2d6a3e,
    roughness: 0.55,
    metalness: 0.05,
    clearcoat: 0.4,
    clearcoatRoughness: 0.5,
    sheen: 0.3,
    sheenColor: new THREE.Color(0x8fbc6a)
  });
  const tube = new THREE.Mesh(tubeGeo, stemMat);
  tube.castShadow = true;
  group.add(tube);

  // Hojas largas de tulipán
  const leafMat = new THREE.MeshPhysicalMaterial({
    color: 0x3a7d4a,
    roughness: 0.5,
    clearcoat: 0.35,
    side: THREE.DoubleSide,
    sheen: 0.4,
    sheenColor: new THREE.Color(0xa8d68a)
  });
  const leafShape = new THREE.Shape();
  leafShape.moveTo(0, 0);
  leafShape.bezierCurveTo(0.12, 0.15, 0.16, 0.5, 0.05, 0.85);
  leafShape.bezierCurveTo(0.0, 0.9, -0.03, 0.85, -0.02, 0.75);
  leafShape.bezierCurveTo(-0.04, 0.45, -0.06, 0.15, 0, 0);
  const leafGeo = new THREE.ShapeGeometry(leafShape, 20);
  // Curvar la hoja
  const lp = leafGeo.attributes.position;
  for (let i = 0; i < lp.count; i++) {
    const y = lp.getY(i);
    lp.setZ(i, Math.sin(y * 2.5) * 0.05);
  }
  leafGeo.computeVertexNormals();

  for (let i = 0; i < 2; i++) {
    const leaf = new THREE.Mesh(leafGeo, leafMat);
    const t = 0.3 + i * 0.25;
    const p = curve.getPoint(t);
    leaf.position.copy(p);
    leaf.rotation.y = i * Math.PI * 0.8 + Math.random() * 0.5;
    leaf.rotation.x = -0.4 + i * 0.2;
    leaf.scale.set(1.4, 1.3, 1);
    leaf.castShadow = true;
    group.add(leaf);
  }

  return { group, topPoint: curve.getPoint(1) };
}

// ===== Construir el ramo =====
const bouquet = new THREE.Group();
scene.add(bouquet);

const pinkShades = [0xff6fa5, 0xff8fb8, 0xffa8c8, 0xff5c9a, 0xffb6d0, 0xff7aa8];
const tulipData = [
  // {x, z, stemH, curve, tilt}
  { x: 0,     z: 0,     h: 1.55, c: 0.12,  tilt: 0.05 },
  { x: 0.28,  z: 0.12,  h: 1.42, c: -0.18, tilt: 0.15 },
  { x: -0.30, z: 0.08,  h: 1.48, c: 0.20,  tilt: -0.14 },
  { x: 0.16,  z: -0.28, h: 1.35, c: -0.15, tilt: 0.18 },
  { x: -0.14, z: -0.24, h: 1.40, c: 0.10,  tilt: -0.16 },
  { x: 0.42,  z: -0.12, h: 1.25, c: -0.25, tilt: 0.28 },
  { x: -0.40, z: -0.16, h: 1.30, c: 0.22,  tilt: -0.26 },
  { x: 0.05,  z: 0.32,  h: 1.20, c: 0.08,  tilt: 0.30 },
  { x: -0.22, z: 0.34,  h: 1.15, c: -0.12, tilt: -0.28 },
  { x: 0.32,  z: 0.30,  h: 1.18, c: 0.15,  tilt: 0.22 }
];

tulipData.forEach((data, i) => {
  const color = pinkShades[i % pinkShades.length];
  const scale = 0.9 + Math.random() * 0.25;

  const stemInfo = createStem(data.h, data.c);
  stemInfo.group.position.set(data.x, 0, data.z);
  bouquet.add(stemInfo.group);

  const tulip = createTulip(color, scale);
  tulip.position.copy(stemInfo.topPoint);
  tulip.position.x += data.x;
  tulip.position.z += data.z;
  tulip.rotation.x = data.tilt;
  tulip.rotation.z = -data.tilt * 0.6;
  tulip.rotation.y = Math.random() * Math.PI * 2;
  bouquet.add(tulip);
});

// ===== Envoltura del ramo (papel coreano) =====
function createWrap() {
  const wrapGroup = new THREE.Group();
  const wrapMat = new THREE.MeshPhysicalMaterial({
    color: 0xffe4ec,
    roughness: 0.85,
    metalness: 0.0,
    side: THREE.DoubleSide,
    transmission: 0.15,
    thickness: 0.2,
    sheen: 0.5,
    sheenColor: new THREE.Color(0xffffff)
  });

  // Cono de papel alrededor del ramo
  const coneGeo = new THREE.ConeGeometry(0.95, 1.4, 32, 1, true);
  const cone = new THREE.Mesh(coneGeo, wrapMat);
  cone.position.y = 0.7;
  cone.rotation.x = Math.PI;
  cone.castShadow = true;
  cone.receiveShadow = true;
  wrapGroup.add(cone);

  // Borde rizado del papel
  for (let i = 0; i < 18; i++) {
    const ang = (i / 18) * Math.PI * 2;
    const fold = new THREE.Mesh(
      new THREE.PlaneGeometry(0.22, 0.55, 4, 4),
      wrapMat
    );
    fold.position.set(Math.cos(ang) * 0.95, 1.05, Math.sin(ang) * 0.95);
    fold.rotation.y = -ang + Math.PI / 2;
    fold.rotation.x = -0.35 + Math.random() * 0.15;
    fold.castShadow = true;
    wrapGroup.add(fold);
  }

  // Lazo rosa
  const ribbonMat = new THREE.MeshPhysicalMaterial({
    color: 0xff4f8b,
    roughness: 0.35,
    clearcoat: 0.6,
    sheen: 0.9,
    sheenColor: new THREE.Color(0xffb6d0)
  });
  const knot = new THREE.Mesh(new THREE.TorusKnotGeometry(0.1, 0.03, 64, 8, 2, 3), ribbonMat);
  knot.position.set(0, 0.05, 0.85);
  knot.rotation.x = Math.PI / 2;
  knot.scale.set(1.2, 1.2, 1.2);
  wrapGroup.add(knot);

  // Colas del lazo
  for (let s = -1; s <= 1; s += 2) {
    const tail = new THREE.Mesh(
      new THREE.PlaneGeometry(0.12, 0.45, 4, 8),
      ribbonMat
    );
    const tp = tail.geometry.attributes.position;
    for (let i = 0; i < tp.count; i++) {
      const y = tp.getY(i);
      tp.setZ(i, Math.sin(y * 6) * 0.03);
    }
    tail.geometry.computeVertexNormals();
    tail.position.set(s * 0.12, -0.18, 0.85);
    tail.rotation.z = s * 0.4;
    tail.rotation.x = -0.2;
    wrapGroup.add(tail);
  }

  return wrapGroup;
}

const wrap = createWrap();
wrap.position.y = 0.02;
bouquet.add(wrap);

// Ajustar bouquet a la escena
bouquet.position.y = 0.4;
bouquet.position.x = 0;
bouquet.scale.set(1.35, 1.35, 1.35);

// ===== Partículas flotantes (pétalos mágicos) =====
const particleCount = 220;
const particleGeo = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount * 3);
const colors = new Float32Array(particleCount * 3);
const palette = [new THREE.Color(0xffb6d0), new THREE.Color(0xff8fb8), new THREE.Color(0xffe4ec), new THREE.Color(0xffd700)];
for (let i = 0; i < particleCount; i++) {
  positions[i*3] = (Math.random() - 0.5) * 12;
  positions[i*3+1] = Math.random() * 6;
  positions[i*3+2] = (Math.random() - 0.5) * 12;
  const c = palette[Math.floor(Math.random() * palette.length)];
  colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
}
particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
const particleMat = new THREE.PointsMaterial({
  size: 0.045,
  vertexColors: true,
  transparent: true,
  opacity: 0.85,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  sizeAttenuation: true
});
const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);

// ===== Animación =====
const clock = new THREE.Clock();
let bouquetBaseY = bouquet.position.y;

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Ramo flotando suavemente
  bouquet.position.y = bouquetBaseY + Math.sin(t * 0.9) * 0.04;
  bouquet.rotation.y = Math.sin(t * 0.3) * 0.04;

  // Partículas ascendiendo lentamente
  const pos = particles.geometry.attributes.position.array;
  for (let i = 0; i < particleCount; i++) {
    pos[i*3+1] += 0.004;
    if (pos[i*3+1] > 6) {
      pos[i*3+1] = 0;
      pos[i*3] = (Math.random() - 0.5) * 12;
      pos[i*3+2] = (Math.random() - 0.5) * 12;
    }
  }
  particles.geometry.attributes.position.needsUpdate = true;

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ===== Música =====
const musicBtn = document.getElementById('music-btn');
const bgMusic = document.getElementById('bg-music');

musicBtn.addEventListener('click', () => {
  if (bgMusic.paused) {
    bgMusic.play().catch(() => alert('Coloca un archivo music.mp3 en la misma carpeta que este HTML para escuchar la música.'));
    musicBtn.textContent = '⏸️ Pausar música';
  } else {
    bgMusic.pause();
    musicBtn.textContent = '🎵 Reproducir música';
  }
});
</script>

</body>
</html>
