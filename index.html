<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Buenos días 🌷</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    font-family: 'Georgia', serif;
    background: #0d0208;
    height: 100vh; height: 100dvh;
    width: 100vw;
  }

  /* ===== VIDEO DE FONDO ===== */
  #video-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  #video-bg iframe {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100vw;
    height: 56.25vw;
    min-height: 100vh;
    min-width: 177.78vh;
    transform: translate(-50%, -50%) scale(1.15);
    border: none;
    pointer-events: none;
  }
  #video-overlay {
    position: fixed;
    inset: 0;
    z-index: 1;
    background: rgba(10, 2, 8, 0.55);
    pointer-events: none;
  }

  /* ===== RAMO 3D ===== */
  #canvas-container {
    position: fixed; inset: 0;
    z-index: 2;
    pointer-events: none;
  }

  /* ===== STICKER PRINCIPAL ===== */
  #luffy-main {
    position: fixed;
    top: 5%;
    left: 50%;
    transform: translateX(-50%);
    width: clamp(90px, 22vw, 150px);
    z-index: 3;
    filter: drop-shadow(0 8px 20px rgba(255,105,180,0.6));
    animation: floatMain 3.5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes floatMain {
    0%,100% { transform: translateX(-50%) translateY(0) rotate(-2deg); }
    50%     { transform: translateX(-50%) translateY(-10px) rotate(2deg); }
  }

  /* ===== STICKERS DECORATIVOS ===== */
  .deco {
    position: fixed; z-index: 3;
    filter: drop-shadow(0 5px 14px rgba(255,182,193,0.5));
    pointer-events: none; opacity: 0.95;
    width: clamp(50px, 13vw, 85px);
  }
  .deco-1 { top: 11%; left: 4%;  animation: floatDeco 4s   ease-in-out infinite; }
  .deco-2 { top: 16%; right: 4%; animation: floatDeco 4.5s ease-in-out infinite .5s; }
  .deco-3 { bottom: 30%; left: 4%; animation: floatDeco 5s ease-in-out infinite 1s; }
  @keyframes floatDeco {
    0%,100% { transform: translateY(0) rotate(-3deg); }
    50%     { transform: translateY(-8px) rotate(3deg); }
  }

  /* ===== CARTA ===== */
  #letter {
    position: fixed;
    bottom: max(12px, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,240,245,0.96);
    padding: 18px 24px;
    border-radius: 16px;
    width: min(88vw, 380px);
    text-align: center;
    z-index: 4;
    box-shadow: 0 12px 35px rgba(0,0,0,0.6);
    border: 1px solid #ffb6c1;
    backdrop-filter: blur(8px);
  }
  #letter h2 {
    color: #d45d79;
    margin: 0 0 8px;
    font-size: clamp(1.05em, 4.5vw, 1.35em);
    letter-spacing: 0.5px;
  }
  #letter p {
    color: #5a3a4a;
    line-height: 1.65;
    font-size: clamp(0.8em, 3.4vw, 0.92em);
    margin: 0;
  }

  /* ===== BOTÓN ACTIVAR SONIDO ===== */
  #sound-btn {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    right: 14px;
    z-index: 10;
    background: linear-gradient(135deg, #d45d79, #b84a64);
    color: white;
    border: none;
    border-radius: 30px;
    padding: 12px 20px;
    cursor: pointer;
    font-size: clamp(0.78em, 3.2vw, 0.88em);
    font-family: inherit;
    box-shadow: 0 4px 18px rgba(212,93,121,0.5);
    transition: transform 0.2s;
    min-height: 44px;
  }
  #sound-btn:active { transform: scale(0.96); }
  #sound-btn.activo {
    background: linear-gradient(135deg, #4caf50, #388e3c);
  }
</style>
</head>
<body>

<!-- Botón para activar sonido (obligatorio por políticas del navegador) -->
<button id="sound-btn" aria-label="Activar sonido">🔊 Activar sonido</button>

<!-- Video de fondo con la API de YouTube -->
<div id="video-bg">
  <div id="yt-player"></div>
</div>
<div id="video-overlay"></div>

<!-- Sticker principal -->
<img id="luffy-main"
     src="https://media2.giphy.com/media/v1.Y2lkPTZjMDliOTUyeGhqNjdzdjRscG4xaGhubGVkeW05M2R2MTRpbG93NjM5cGlldWFkdSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/2aKoKy8bAWJr8bBMak/giphy.webp"
     alt="Luffy">

<!-- Stickers decorativos -->
<img class="deco deco-1" src="https://media.giphy.com/media/p8UwphhvFXKrxS42fk/giphy.gif" alt="deco1">
<img class="deco deco-2" src="https://media.giphy.com/media/x2GRI1mBm4kBXv0njJ/giphy.gif" alt="deco2">
<img class="deco deco-3" src="https://media.giphy.com/media/H0hCZKoldTWPzil50u/giphy.gif" alt="deco3">

<!-- Ramo 3D -->
<div id="canvas-container"></div>

<!-- Carta -->
<div id="letter">
  <h2>☀️ Buenos días, mi amor ☀️</h2>
  <p>
    Abrí los ojos y lo primero que pensé fuiste tú.<br>
    Te dejo estas flores para que tu día empiece<br>
    tan bonito como lo haces tú. 🌷<br>
    <strong>Que tengas un día maravilloso. Te quiero.</strong>
  </p>
</div>

<!-- API de YouTube -->
<script>
  // Cargar la API de IFrame de YouTube
  var tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  var firstScriptTag = document.getElementsByTagName('script')[0];
  firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

  var player;
  var videoReady = false;

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('yt-player', {
      videoId: '935cXSVohNY',
      playerVars: {
        autoplay: 1,
        mute: 1,            // Obligatorio para autoplay inicial
        start: 10,          // Empieza en el segundo 10
        loop: 1,
        playlist: '935cXSVohNY',
        controls: 0,
        showinfo: 0,
        rel: 0,
        modestbranding: 1,
        disablekb: 1,
        playsinline: 1,
        iv_load_policy: 3,
        fs: 0               // Sin botón de pantalla completa
      },
      events: {
        onReady: function(event) {
          videoReady = true;
          event.target.playVideo();
          // Estilo del iframe para que cubra la pantalla
          const iframe = event.target.getIframe();
          iframe.style.position = 'absolute';
          iframe.style.top = '50%';
          iframe.style.left = '50%';
          iframe.style.width = '100vw';
          iframe.style.height = '56.25vw';
          iframe.style.minHeight = '100vh';
          iframe.style.minWidth = '177.78vh';
          iframe.style.transform = 'translate(-50%, -50%) scale(1.15)';
          iframe.style.border = 'none';
          iframe.style.pointerEvents = 'none';  // No se puede clicar/pausar
        },
        onStateChange: function(event) {
          // Si por alguna razón se pausa, forzar reproducción
          if (event.data === YT.PlayerState.PAUSED) {
            event.target.playVideo();
          }
        }
      }
    });
  }

  // Botón para activar sonido
  const soundBtn = document.getElementById('sound-btn');
  let soundOn = false;

  soundBtn.addEventListener('click', () => {
    if (!player || !videoReady) return;
    if (!soundOn) {
      player.unMute();
      player.setVolume(80);
      player.seekTo(10, true);
      player.playVideo();
      soundOn = true;
      soundBtn.textContent = '🔇 Silenciar';
      soundBtn.classList.add('activo');
    } else {
      player.mute();
      soundOn = false;
      soundBtn.textContent = '🔊 Activar sonido';
      soundBtn.classList.remove('activo');
    }
  });
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x1a0510, 0.05);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 100);
function setCameraForViewport() {
  const aspect = innerWidth / innerHeight;
  if (aspect < 1) {
    camera.position.set(0, 2.6, 8.5);
    camera.fov = 55;
  } else {
    camera.position.set(0, 2.2, 6.5);
    camera.fov = 45;
  }
  camera.updateProjectionMatrix();
}
setCameraForViewport();

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.getElementById('canvas-container').appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
controls.target.set(0, 1.5, 0);
controls.enablePan = false;
controls.enableZoom = false;
controls.enableRotate = false;
controls.minPolarAngle = 0.6;
controls.maxPolarAngle = 1.55;

scene.add(new THREE.AmbientLight(0xffd6e0, 0.6));
const keyLight = new THREE.DirectionalLight(0xfff2e6, 3.0);
keyLight.position.set(4, 8, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 30;
keyLight.shadow.camera.left = -6;
keyLight.shadow.camera.right = 6;
keyLight.shadow.camera.top = 6;
keyLight.shadow.camera.bottom = -6;
keyLight.shadow.bias = -0.0005;
scene.add(keyLight);
const fillLight = new THREE.PointLight(0xff8fbc, 2.0, 20, 2);
fillLight.position.set(-4, 3, 4);
scene.add(fillLight);
const rimLight = new THREE.PointLight(0xc8a2ff, 2.5, 20, 2);
rimLight.position.set(0, 4, -6);
scene.add(rimLight);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(12, 64),
  new THREE.MeshStandardMaterial({
    color: 0x2a1020, roughness: 0.35, metalness: 0.6, envMapIntensity: 0.8
  })
);
floor.rotation.x = -Math.PI/2;
floor.position.y = -0.02;
floor.receiveShadow = true;
scene.add(floor);

function createPetalGeometry(width, height, cup) {
  const shape = new THREE.Shape();
  shape.moveTo(0, 0);
  shape.bezierCurveTo(width*0.6, height*0.15, width*0.75, height*0.55, width*0.35, height*0.95);
  shape.bezierCurveTo(width*0.15, height*1.05, -width*0.15, height*1.05, -width*0.35, height*0.95);
  shape.bezierCurveTo(-width*0.75, height*0.55, -width*0.6, height*0.15, 0, 0);
  const geo = new THREE.ShapeGeometry(shape, 24);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i);
    const z = -cup * (x*x) * (0.5 + y/height) + Math.sin(y/height*Math.PI)*0.04;
    pos.setZ(i, z);
  }
  geo.computeVertexNormals();
  return geo;
}

function createTulip(color, scale = 1) {
  const group = new THREE.Group();
  const petalMat = new THREE.MeshPhysicalMaterial({
    color, roughness: 0.42, metalness: 0.0,
    clearcoat: 0.55, clearcoatRoughness new: 0.35,
    sheen: 0.8, sheenColor: 0xffffff, sheenRoughness: 0.5,
    side: THREE.DoubleSide, transmission: 0.08, thickness: 0.4, ior: 1.4
  });
  const pw = 0.32*scale, ph = 0.62*scale;
  const outer = [0, Math.PI*2/3, Math.PI*4/3];
  const inner = [Math.PI/3, Math.PI, Math.PI*5/3];
  function addPetal(angle, isInner) {
    const geo = createPetalGeometry(pw, ph, isInner ? 4.5 : 3.8);
    const petal = new THREE.Mesh(geo, petalMat);
    petal.rotation.x = -(isInner ? 0.12 : 0.28);
    petal.rotation.y = angle;
    petal.position.y = isInner ? 0.06*scale : 0;
    petal.castShadow = true; petal.receiveShadow = true;
    group.add(petal);
  }
  outer.forEach(a => addPetal(a, false));
  inner.forEach(a => addPetal(a, true));

  const stamenMat = new THREE.MeshStandardMaterial({ color: 0x2b1a10, roughness: 0.8 });
  const pollenMat = new THREE.MeshStandardMaterial({ color: 0xf5c542, roughness: 0.6, emissive: 0x8a6a10, emissiveIntensity: 0.3 });
  for (let i = 0; i < 6; i++) {
    const ang = (i/6)*Math.PI*2;
    const st = new THREE.Mesh(new THREE.CylinderGeometry(0.008*scale, 0.012*scale, 0.16*scale, 6), stamenMat);
    st.position.set(Math.cos(ang)*0.05*scale, 0.1*scale, Math.sin(ang)*0.05*scale);
    group.add(st);
    const po = new THREE.Mesh(new THREE.SphereGeometry(0.02*scale, 8, 8), pollenMat);
    po.position.copy(st.position).add(new THREE.Vector3(0, 0.09*scale, 0));
    group.add(po);
  }
  const pistil = THREE.Mesh(new THREE.SphereGeometry(0.045*scale, 12, 12),
    new THREE.MeshStandardMaterial({ color: 0x3d2414, roughness: 0.7 }));
  pistil.position.y = 0.09*scale;
  group.add(pistil);
  return group;
}

function createStem(height, curveAmount) {
  const group = new THREE.Group();
  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, 0, 0),
    new THREE.Vector3(curveAmount*0.3, height*0.33, curveAmount*0.2),
    new THREE.Vector3(curveAmount*0.6, height*0.66, -curveAmount*0.3),
    new THREE.Vector3(curveAmount, height, 0)
  ]);
  const tube = new THREE.Mesh(
    new THREE.TubeGeometry(curve, 20, 0.025, 8, false),
    new THREE.MeshPhysicalMaterial({
      color: 0x2d6a3e, roughness: 0.55, metalness: 0.05,
      clearcoat: 0.4, clearcoatRoughness: 0.5,
      sheen: 0.3, sheenColor: 0x8fbc6a
    })
  );
  tube.castShadow = true;
  group.add(tube);

  const leafMat = new THREE.MeshPhysicalMaterial({
    color: 0x3a7d4a, roughness: 0.5, clearcoat: 0.35,
    side: THREE.DoubleSide, sheen: 0.4, sheenColor: 0xa8d68a
  });
  const ls = new THREE.Shape();
  ls.moveTo(0, 0);
  ls.bezierCurveTo(0.12, 0.15, 0.16, 0.5, 0.05, 0.85);
  ls.bezierCurveTo(0.0, 0.9, -0.03, 0.85, -0.02, 0.75);
  ls.bezierCurveTo(-0.04, 0.45, -0.06, 0.15, 0, 0);
  const lg = new THREE.ShapeGeometry(ls, 16);
  const lp = lg.attributes.position;
  for (let i = 0; i < lp.count; i++) {
    const y = lp.getY(i);
    lp.setZ(i, Math.sin(y*2.5)*0.05);
  }
  lg.computeVertexNormals();
  for (let i = 0; i < 2; i++) {
    const leaf = new THREE.Mesh(lg, leafMat);
    const p = curve.getPoint(0.3 + i*0.25);
    leaf.position.copy(p);
    leaf.rotation.y = i*Math.PI*0.8 + Math.random()*0.5;
    leaf.rotation.x = -0.4 + i*0.2;
    leaf.scale.set(1.4, 1.3, 1);
    leaf.castShadow = true;
    group.add(leaf);
  }
  return { group, topPoint: curve.getPoint(1) };
}

const bouquet = new THREE.Group();
scene.add(bouquet);

const pinkShades = [0xff6fa5, 0xff8fb8, 0xffa8c8, 0xff5c9a, 0xffb6d0, 0xff7aa8];
const tulipData = [
  { x: 0,     z: 0,     h: 1.55, c: 0.12,  tilt: 0.05 },
  { x: 0.28,  z: 0.12,  h: 1.42, c: -0.18, tilt: 0.15 },
  { x: -0.30, z: 0.08,  h: 1.48, c: 0.20,  tilt: -0.14 },
  { x: 0.16,  z: -0.28, h: 1.35, c: -0.15, tilt: 0.18 },
  { x: -0.14, z: -0.24, h: 1.40, c: 0.10,  tilt: -0.16 },
  { x: 0.42,  z: -0.12, h: 1.25, c: -0.25, tilt: 0.28 },
  { x: -0.40, z: -0.16, h: 1.30, c: 0.22,  tilt: -0.26 },
  { x: 0.05,  z: 0.32,  h: 1.20, c: 0.08,  tilt: 0.30 },
  { x: -0.22, z: 0.34,  h: 1.15, c: -0.12, tilt: -0.28 },
  { x: 0.32,  z: 0.30,  h: 1.18, c: 0.15,  tilt: 0.22 }
];

tulipData.forEach((data, i) => {
  const color = pinkShades[i % pinkShades.length];
  const scale = 0.9 + Math.random()*0.25;
  const s = createStem(data.h, data.c);
  s.group.position.set(data.x, 0, data.z);
  bouquet.add(s.group);
  const t = createTulip(color, scale);
  t.position.copy(s.topPoint);
  t.position.x += data.x;
  t.position.z += data.z;
  t.rotation.x = data.tilt;
  t.rotation.z = -data.tilt*0.6;
  t.rotation.y = Math.random()*Math.PI*2;
  bouquet.add(t);
});

function createWrap() {
  const g = new THREE.Group();
  const mat = new THREE.MeshPhysicalMaterial({
    color: 0xffe4ec, roughness: 0.85, metalness: 0.0,
    side: THREE.DoubleSide, transmission: 0.15, thickness: 0.2,
    sheen: 0.5, sheenColor: 0xffffff
  });
  const cone = new THREE.Mesh(new THREE.ConeGeometry(0.95, 1.4, 24, 1, true), mat);
  cone.position.y = 0.7;
  cone.rotation.x = Math.PI;
  cone.castShadow = true; cone.receiveShadow = true;
  g.add(cone);
  for (let i = 0; i < 16; i++) {
    const ang = (i/16)*Math.PI*2;
    const fold = new THREE.Mesh(new THREE.PlaneGeometry(0.22, 0.55, 2, 2), mat);
    fold.position.set(Math.cos(ang)*0.95, 1.05, Math.sin(ang)*0.95);
    fold.rotation.y = -ang + Math.PI/2;
    fold.rotation.x = -0.35 + Math.random()*0.15;
    g.add(fold);
  }
  const ribbonMat = new THREE.MeshPhysicalMaterial({
    color: 0xff4f8b, roughness: 0.35, clearcoat: 0.6,
    sheen: 0.9, sheenColor: 0xffb6d0
  });
  const knot = new THREE.Mesh(new THREE.TorusKnotGeometry(0.1, 0.03, 48, 6, 2, 3), ribbonMat);
  knot.position.set(0, 0.05, 0.85);
  knot.rotation.x = Math.PI/2;
  knot.scale.set(1.2, 1.2, 1.2);
  g.add(knot);
  return g;
}
const wrap = createWrap();
wrap.position.y = 0.02;
bouquet.add(wrap);

bouquet.position.set(0, 0.3, 0);
bouquet.scale.set(1.3, 1.3, 1.3);

const pc = 160;
const pg = new THREE.BufferGeometry();
const pp = new Float32Array(pc*3);
const pcolors = new Float32Array(pc*3);
const palette = [new THREE.Color(0xffb6d0), new THREE.Color(0xff8fb8), new THREE.Color(0xffe4ec), new THREE.Color(0xffd700)];
for (let i = 0; i < pc; i++) {
  pp[i*3] = (Math.random()-0.5)*12;
  pp[i*3+1] = Math.random()*6;
  pp[i*3+2] = (Math.random()-0.5)*12;
  const c = palette[Math.floor(Math.random()*palette.length)];
  pcolors[i*3] = c.r; pcolors[i*3+1] = c.g; pcolors[i*3+2] = c.b;
}
pg.setAttribute('position', new THREE.BufferAttribute(pp, 3));
pg.setAttribute('color', new THREE.BufferAttribute(pcolors, 3));
const particles = new THREE.Points(pg, new THREE.PointsMaterial({
  size: 0.045, vertexColors: true, transparent: true, opacity: 0.85,
  blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
}));
scene.add(particles);

const clock = new THREE.Clock();
const bouquetBaseY = bouquet.position.y;

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  bouquet.position.y = bouquetBaseY + Math.sin(t*0.9)*0.04;
  bouquet.rotation.y = Math.sin(t*0.3)*0.04;

  const pos = particles.geometry.attributes.position.array;
  for (let i = 0; i < pc; i++) {
    pos[i*3+1] += 0.004;
    if (pos[i*3+1] > 6) {
      pos[i*3+1] = 0;
      pos[i*3] = (Math.random()-0.5)*12;
      pos[i*3+2] = (Math.random()-0.5)*12;
    }
  }
  particles.geometry.attributes.position.needsUpdate = true;

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  setCameraForViewport();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>
